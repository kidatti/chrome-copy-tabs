<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CopyTabs</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="popup-header">
        <span class="brand">CopyTabs</span>
        <span class="dev-badge" id="devBadge" hidden>DEV</span>
        <button type="button" class="manage-button" id="viewAllTabsIcon">
            <img src="images/folder.svg" alt="">
            <span id="manage-label"></span><span aria-hidden="true">·</span><span id="tabCount">0</span>
        </button>
        <button type="button" class="settings-icon" id="settingsIcon">
            <img src="images/settings.svg" alt="">
        </button>
    </header>
    <main>
        <section class="section save-section">
            <div class="current-tab-info">
                <div class="current-tab-title" id="current-tab-title"></div>
                <div class="current-tab-url" id="current-tab-url"></div>
            </div>
            <label class="section-label" id="save-folder-label" for="folder-select"></label>
            <div class="action-row save-row">
                <select id="folder-select"><option value="null"></option></select>
                <button type="button" id="markCurrentTab" class="primary"></button>
            </div>
            <button type="button" id="markAllTabs" class="secondary wide"></button>
        </section>
        <section class="section" aria-labelledby="copy-section-title">
            <h2 class="section-label" id="copy-section-title"></h2>
            <div class="action-row">
                <button type="button" id="copyCurrentTab"></button>
                <button type="button" id="copyAllTabs"></button>
            </div>
        </section>
        <details class="details-section" id="export-details">
            <summary id="export-section-title"></summary>
            <div class="action-row export-actions">
                <button type="button" id="exportHtmlCurrentTab">HTML</button>
                <button type="button" id="exportHtmlArticleCurrentTab"></button>
                <button type="button" id="exportMarkdownCurrentTab">Markdown</button>
            </div>
        </details>
        <details class="details-section" id="recent-details">
            <summary id="recent-section-title"></summary>
            <div id="tab-list" class="tab-list"></div>
        </details>
        <div id="message" role="status" aria-live="polite"></div>
    </main>
    <div id="title" hidden></div>
    <div id="url" hidden></div>
    <textarea id="input" class="copy-input" tabindex="-1" aria-hidden="true"></textarea>
    <script src="i18n.js"></script>
    <script src="readability.js"></script>
    <script src="contents.js"></script>
</body>
</html>
