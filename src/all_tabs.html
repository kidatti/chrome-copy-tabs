<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title id="page-title"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="all_tabs.css">
</head>
<body>
    <header class="app-header">
        <span class="brand">CopyTabs</span>
        <span class="app-subtitle" data-i18n="savedPages"></span>
        <button type="button" class="settings-icon" id="settingsIcon">
            <img src="images/settings.svg" alt="">
        </button>
    </header>
    <div class="container">
        <aside class="sidebar">
            <button type="button" class="folder-item active" id="all-folders" data-folder-id="__all__">
                <span class="folder-name" data-i18n="allSavedPages"></span>
                <span class="folder-count" id="all-folders-count">0</span>
            </button>
            <p class="sidebar-label" data-i18n="folders"></p>
            <nav class="folder-list" id="folder-list">
                <div class="folder-item" data-folder-id="null">
                    <div class="folder-left">
                        <span class="folder-toggle"></span>
                        <button type="button" class="folder-name" id="uncategorized-name"></button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <div class="folder-actions">
                            <button type="button" class="folder-btn rename-uncategorized-btn" data-folder-id="null">
                                <img src="images/edit.svg" alt="">
                            </button>
                        </div>
                        <span class="folder-count" id="uncategorized-count">0</span>
                    </div>
                </div>
            </nav>
            <button type="button" class="add-folder-btn" id="add-folder-btn"></button>
        </aside>
        <main class="main-content">
            <header class="page-header">
                <h1 id="view-title"></h1>
                <span class="result-count" id="result-count" aria-live="polite"></span>
            </header>
            <div class="search-toolbar">
                <label class="search-field">
                    <span class="sr-only" data-i18n="searchPages"></span>
                    <input type="search" id="tab-search" autocomplete="off">
                </label>
                <label class="sort-field">
                    <span data-i18n="sortBy"></span>
                    <select id="sort-select">
                        <option value="newest" data-i18n="sortNewest"></option>
                        <option value="oldest" data-i18n="sortOldest"></option>
                        <option value="title" data-i18n="sortTitle"></option>
                        <option value="manual" data-i18n="sortManual"></option>
                    </select>
                </label>
            </div>
            <div class="selection-toolbar">
                <label class="select-all"><input type="checkbox" id="select-all"><span data-i18n="selectDisplayed"></span></label>
                <span class="selection-count" id="selection-count" aria-live="polite"></span>
                <div class="copy-action">
                    <label class="sr-only" for="copy-format" data-i18n="copyFormat"></label>
                    <select id="copy-format">
                        <option value="url" data-i18n="formatUrls"></option>
                        <option value="title" data-i18n="formatTitlesUrls"></option>
                        <option value="markdown" data-i18n="formatMarkdown"></option>
                    </select>
                    <button type="button" class="primary" id="copy-pages"></button>
                </div>
            </div>
            <div class="bulk-toolbar" id="bulk-toolbar" hidden>
                <label for="bulk-folder-select" data-i18n="moveDestination"></label>
                <select class="folder-select" id="bulk-folder-select"></select>
                <button type="button" id="bulk-move" data-i18n="moveSelected"></button>
                <button type="button" class="danger" id="bulk-delete" data-i18n="deleteSelected"></button>
            </div>
            <p class="view-hint" id="view-hint"></p>
            <div id="tab-list" class="tab-list"></div>
            <textarea id="copy-textarea" class="sr-only" tabindex="-1" aria-hidden="true"></textarea>
        </main>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Modal dialogs -->
    <div id="modal-overlay" class="modal-overlay">
        <div id="delete-tabs-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-tabs-title">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="delete-tabs-title" data-i18n="deleteSelected"></h3>
                    <button type="button" class="modal-close" data-modal="delete-tabs-modal">&times;</button>
                </div>
                <div class="modal-body"><p id="delete-tabs-message"></p><p data-i18n="lockedPagesProtected"></p></div>
                <div class="modal-footer">
                    <button type="button" class="modal-btn cancel" id="delete-tabs-cancel" data-i18n="cancel"></button>
                    <button type="button" class="modal-btn confirm danger" id="delete-tabs-confirm" data-i18n="delete"></button>
                </div>
            </div>
        </div>

        <!-- Add Folder Modal -->
        <div id="add-folder-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="add-folder-title">新しいフォルダ</h3>
                    <button class="modal-close" data-modal="add-folder-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <label for="folder-name-input" id="folder-name-label">フォルダ名:</label>
                    <input type="text" id="folder-name-input" class="modal-input" placeholder="フォルダ名を入力">
                </div>
                <div class="modal-footer">
                    <button id="add-folder-cancel" class="modal-btn cancel">キャンセル</button>
                    <button id="add-folder-confirm" class="modal-btn confirm">作成</button>
                </div>
            </div>
        </div>
        
        <!-- Rename Folder Modal -->
        <div id="rename-folder-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="rename-folder-title">フォルダ名変更</h3>
                    <button class="modal-close" data-modal="rename-folder-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <label for="rename-folder-input" id="rename-folder-label">新しいフォルダ名:</label>
                    <input type="text" id="rename-folder-input" class="modal-input" placeholder="新しいフォルダ名を入力">
                </div>
                <div class="modal-footer">
                    <button id="rename-folder-cancel" class="modal-btn cancel">キャンセル</button>
                    <button id="rename-folder-confirm" class="modal-btn confirm">変更</button>
                </div>
            </div>
        </div>
        
        <!-- Delete Folder Modal -->
        <div id="delete-folder-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="delete-folder-title">フォルダ削除</h3>
                    <button class="modal-close" data-modal="delete-folder-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <p id="delete-folder-message">このフォルダを削除しますか？</p>
                    <p id="delete-folder-warning">フォルダ内のタブは未分類に移動されます。</p>
                </div>
                <div class="modal-footer">
                    <button id="delete-folder-cancel" class="modal-btn cancel">キャンセル</button>
                    <button id="delete-folder-confirm" class="modal-btn confirm danger">削除</button>
                </div>
            </div>
        </div>

        <!-- Edit Tab Modal -->
        <div id="edit-tab-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="edit-tab-title">タブ編集</h3>
                    <button class="modal-close" data-modal="edit-tab-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <label for="edit-tab-title-input" id="tab-title-label">タイトル:</label>
                    <input type="text" id="edit-tab-title-input" class="modal-input" placeholder="タイトルを入力">
                    <br><br>
                    <label for="edit-tab-url-input" id="tab-url-label">URL:</label>
                    <input type="text" id="edit-tab-url-input" class="modal-input" placeholder="URLを入力">
                </div>
                <div class="modal-footer">
                    <button id="edit-tab-cancel" class="modal-btn cancel">キャンセル</button>
                    <button id="edit-tab-confirm" class="modal-btn confirm">保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="i18n.js"></script>
    <script src="tab_view.js"></script>
    <script src="all_tabs.js"></script>
</body>
</html>
