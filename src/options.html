<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CopyTabs Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 16px;
            color: #333;
            font-size: 14px;
            line-height: 1.5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 {
            margin-top: 0;
            color: #2196F3;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 12px;
            font-size: 22px;
            font-weight: 600;
        }
        h2 {
            color: #2196F3;
            font-size: 16px;
            font-weight: 600;
            margin-top: 16px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
        }
        h2:first-of-type {
            margin-top: 8px;
        }
        h3 {
            color: #2196F3;
            font-size: 14px;
            font-weight: 600;
            margin-top: 16px;
            margin-bottom: 10px;
            padding-bottom: 4px;
            border-bottom: 1px solid #e9ecef;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            box-sizing: border-box;
        }
        select:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }
        button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            min-width: 100px;
            box-sizing: border-box;
            height: auto;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        button:hover {
            background-color: #0b7dda;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(33, 150, 243, 0.3);
        }
        .button-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin-right: 8px;
            margin-bottom: 8px;
            min-width: 100px;
            box-sizing: border-box;
            height: auto;
        }
        .button-secondary:hover {
            background-color: #545b62;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(108, 117, 125, 0.3);
        }
        .button-danger {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            min-width: 100px;
            box-sizing: border-box;
            height: auto;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        .button-danger:hover {
            background-color: #c82333;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(220, 53, 69, 0.3);
        }
        .file-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 12px;
            background-color: #fff;
            box-sizing: border-box;
            display: block;
        }
        .file-input:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }
        .status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .section {
            background-color: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #e0e0e0;
        }
        #storage-display {
            margin-top: 24px;
            border-top: 1px solid #e0e0e0;
            padding-top: 16px;
        }
        #storage-json {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
        }
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .button-group .button-secondary,
        .button-group .button-danger {
            margin-right: 0;
            margin-bottom: 0;
        }
        .description {
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        /* Header styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px;
        }
        .header h1 {
            margin: 0;
            border: none;
            padding: 0;
        }
        .all-tabs-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .all-tabs-icon:hover {
            background: rgba(0, 0, 0, 0.06);
        }
        .all-tabs-icon img {
            width: 22px;
            height: 22px;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }
        .all-tabs-icon:hover img {
            opacity: 0.9;
        }
        h2 img, h3 img {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 6px;
        }
        button img {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            margin-right: 5px;
        }
        label img {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            margin-right: 6px;
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            transform: scale(0.7);
            transition: transform 0.3s ease;
            display: none;
            z-index: 1001;
        }
        .modal.show {
            display: block;
            transform: scale(1);
        }
        .modal:not(.show) {
            display: none !important;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 90%;
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 16px;
            color: #333;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }
        .modal-content p {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.5;
            text-align: center;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-buttons button {
            margin: 0;
            min-width: 90px;
        }
        /* Storage usage styles */
        .storage-usage-container {
            margin-top: 8px;
        }
        .storage-progress {
            width: 100%;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .storage-progress-bar {
            height: 100%;
            background-color: #2196F3;
            border-radius: 10px;
            transition: width 0.3s ease;
            min-width: 0;
        }
        .storage-progress-bar.warning {
            background-color: #ff9800;
        }
        .storage-progress-bar.danger {
            background-color: #dc3545;
        }
        .storage-usage-text {
            font-size: 13px;
            color: #666;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="settings-title">CopyTabs Settings</h1>
            <div class="all-tabs-icon" id="allTabsIcon" title="View All Tabs">
                <img src="images/folder.svg" alt="All Tabs">
            </div>
        </div>
        <!-- Language Settings Section -->
        <div class="section">
            <h2 id="language-section-title"><img src="images/language.svg" alt="">Language Settings</h2>
            <div class="form-group">
                <select id="language-select">
                    <option value="auto" id="auto-option">Auto (Based on browser)</option>
                    <option value="ja" id="ja-option">日本語</option>
                    <option value="en" id="en-option">English</option>
                </select>
            </div>
            <button id="save-button"><img src="images/save_white.svg" alt="">Save Settings</button>
            <div id="language-status" class="status"></div>
        </div>
        
        <!-- Data Management Section -->
        <div class="section">
            <h2 id="data-management-title"><img src="images/folder_open.svg" alt="">Data Management</h2>
            <div id="data-status" class="status"></div>
            
            <div class="form-group">
                <label id="export-label"><img src="images/upload.svg" alt="">Export Data:</label>
                <p class="description" id="export-description">Download all your data as a JSON backup file.</p>
                <button id="export-button" class="button-secondary"><img src="images/download_white.svg" alt="">Export JSON</button>
            </div>

            <div class="form-group">
                <label for="import-file" id="import-label"><img src="images/download.svg" alt="">Import Data:</label>
                <input type="file" id="import-file" class="file-input" accept=".json">
                <button id="import-button" class="button-secondary"><img src="images/upload_white.svg" alt="">Import JSON</button>
            </div>

            <div class="form-group" style="margin-top: 24px;">
                <h3 id="storage-contents-title"><img src="images/search.svg" alt="">Storage Contents</h3>
                <div id="storage-json"></div>
                <div class="button-group" style="margin-top: 12px;">
                    <button id="refresh-storage-button" class="button-secondary"><img src="images/refresh_white.svg" alt="">Refresh Data</button>
                    <button id="clear-data-button" class="button-danger"><img src="images/delete_white.svg" alt="">Clear All Data</button>
                </div>
            </div>
        </div>

        <!-- Storage Usage Section -->
        <div class="section">
            <h2 id="storage-usage-title"><img src="images/storage.svg" alt="">Storage Usage</h2>
            <div class="storage-usage-container">
                <div class="storage-progress">
                    <div id="storage-progress-bar" class="storage-progress-bar"></div>
                </div>
                <div id="storage-usage-text" class="storage-usage-text"></div>
            </div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay">
        <!-- Clear Data Confirmation Modal -->
        <div id="clear-data-modal" class="modal">
            <div class="modal-content">
                <h3 id="clear-data-title"><img src="images/delete.svg" alt="">Clear All Data</h3>
                <p id="clear-data-message">DELETE: This will permanently delete all your data. Are you sure?</p>
                <div class="modal-buttons">
                    <button id="clear-data-cancel" class="button-secondary">Cancel</button>
                    <button id="clear-data-confirm" class="button-danger">Delete All</button>
                </div>
            </div>
        </div>
        
        <!-- Import Data Confirmation Modal -->
        <div id="import-data-modal" class="modal">
            <div class="modal-content">
                <h3 id="import-data-title"><img src="images/download.svg" alt="">Import Data</h3>
                <p id="import-data-message">IMPORT: This will replace all current data. Are you sure?</p>
                <div class="modal-buttons">
                    <button id="import-data-cancel" class="button-secondary">Cancel</button>
                    <button id="import-data-confirm" class="button-secondary">Import</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="i18n.js"></script>
    <script src="options.js"></script>
</body>
</html>
