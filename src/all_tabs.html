<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title id="page-title"></title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            min-height: calc(100vh - 48px);
            box-sizing: border-box;
        }
        .tab-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .tab-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .tab-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .tab-info {
            flex: 1;
            margin-right: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-info:hover {
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .tab-title {
            font-size: 16px;
            color: #333333;
            margin-bottom: 4px;
            word-break: break-all;
        }
        .tab-url {
            font-size: 14px;
            color: #666666;
            word-break: break-all;
        }
        .delete-btn {
            padding: 8px 16px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .delete-btn:hover {
            background-color: #ff0000;
        }
        .lock-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.2s ease;
        }
        .lock-icon:hover {
            opacity: 1;
        }
        .lock-icon.locked {
            opacity: 1;
        }
        .tab-item.locked {
            background-color: #f8f9fa;
            border-color: #ff4444;
        }
        .no-tabs {
            text-align: center;
            color: #666666;
            padding: 40px;
            font-size: 18px;
        }
        .timestamp {
            font-size: 12px;
            color: #999999;
            margin-top: 4px;
        }
        .page-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 32px;
            color: #333;
            margin: 0;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1 id="page-title">Marked Tabs</h1>
        </div>
        <div id="tab-list" class="tab-list"></div>
    </div>
    <script src="i18n.js"></script>
    <script src="all_tabs.js"></script>
</body>
</html>
